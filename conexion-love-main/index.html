<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Pachucha Guadis ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
:root {
      --night-black: #05030a;
      --deep-purple: #160b29;
      --space-nebula: #2a0845;
      --soft-violet: #a855f7;
      --pastel-lila: #d8b4fe;
      --starlight-gold: #fbbf24;
      --soft-pink: #f472b6;
      --soft-blue: #38bdf8;
      --font-romantic: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    /* BLOQUEO TOTAL DE SCROLL */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      outline: none; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, var(--space-nebula) 0%, var(--deep-purple) 50%, var(--night-black) 100%);
      background-size: 100% 100%;
      color: var(--pastel-lila);
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      margin: 0;
      position: relative;
    }

    /* INTRO ESPACIAL OPTIMIZADA */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      animation: spaceGlowIntro 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      will-change: transform, opacity;
    }

    #neural-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      animation: fadeInBg 2s ease-out 0.5s forwards;
      will-change: opacity;
    }

    /* HEADER / TITULO */
    .header-container {
      text-align: center;
      margin-top: 1vh;
      margin-bottom: 0.5vh;
      z-index: 100;
      opacity: 0;
      animation: fadeInDown 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      will-change: transform, opacity;
    }

    .special-title {
      font-family: var(--font-romantic);
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--pastel-lila);
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.7);
      margin-bottom: 2px;
    }

    .special-subtitle {
      font-family: var(--font-romantic);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--starlight-gold);
      letter-spacing: 1.5px;
      opacity: 0.95;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    }

    /* BOTÓN VOLVER INICIO */
    .volver-inicio {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(22, 11, 41, 0.85);
      border: 1px solid rgba(216, 180, 254, 0.35);
      color: var(--pastel-lila);
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
      will-change: transform;
    }

    .volver-inicio:hover {
      transform: translateY(-2px);
      background: rgba(30, 18, 51, 0.95);
      border-color: var(--pastel-lila);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
    }

    .volver-inicio:active {
      transform: translateY(0) scale(0.96);
    }

    /* CONTENEDOR PRINCIPAL DEL MAPA CENTRADO */
    .graphic-container {
      width: 100%;
      max-width: 950px;
      aspect-ratio: 16 / 10;
      position: relative;
      margin: auto 0;
      z-index: 10;
      opacity: 0;
      transform: scale(0.95) translateZ(0);
      animation: cosmicReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      will-change: transform, opacity;
    }

    /* CORAZÓN PERFECTAMENTE CENTRADO */
    .brain-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brain-inner {
      width: 120px; 
      height: 120px;
      color: var(--pastel-lila);
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.7));
      animation: gentleFloat 5s ease-in-out infinite;
      transition: transform 0.3s ease, filter 0.3s ease;
      will-change: transform;
    }

    .brain-inner svg {
      width: 100%; height: 100%;
      stroke-width: 1.5;
    }

    .synapse {
      fill: var(--soft-violet);
      animation: synapsePulse 2s infinite alternate;
    }
    .synapse:nth-child(odd) { animation-delay: 0.5s; fill: var(--pastel-lila); }
    .synapse:nth-child(3n) { animation-delay: 1s; fill: var(--soft-pink); }
    
    @keyframes synapsePulse {
      0% { r: 1.8; opacity: 0.6; }
      100% { r: 3.5; opacity: 1; }
    }

    .brain-inner.active {
      transform: scale(1.15) !important;
      filter: drop-shadow(0 0 35px rgba(168, 85, 247, 1));
    }

    .heart-center-text {
      font-family: var(--font-romantic);
      font-size: 0.95rem;
      color: var(--pastel-lila);
      margin-top: 4px;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
      white-space: nowrap;
    }

    .lines-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .connection-base {
      fill: none;
      stroke: rgba(216, 180, 254, 0.2);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .connection-pulse {
      fill: none;
      stroke: var(--soft-violet);
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0;
    }

    .connection-branch {
      fill: none;
      stroke: var(--pastel-lila);
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0;
    }

    .node-wrapper {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 30;
    }

    .icon-node {
      width: 76px; 
      height: 76px; 
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(10, 6, 18, 0.95) 100%);
      border-radius: 50%;
      border: 1.5px solid rgba(216, 180, 254, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease;
      position: relative;
      will-change: transform;
    }

    .float-1 { animation: gentleFloat 6s ease-in-out infinite; }
    .float-2 { animation: gentleFloat 7s ease-in-out infinite reverse; }

    .icon-node:hover {
      background: radial-gradient(circle, rgba(244, 114, 182, 0.45) 0%, rgba(30, 18, 51, 0.95) 100%);
      border-color: var(--pastel-lila);
      transform: scale(1.1) translateY(-3px);
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.6);
    }

    .icon-node svg {
      width: 32px; 
      height: 32px;
      fill: none;
      stroke: var(--pastel-lila);
      stroke-width: 1.5;
      transition: stroke 0.3s ease;
    }

    .icon-node:hover svg {
      stroke: #fff;
    }

    .tooltip {
      position: absolute;
      top: -38px;
      background: transparent;
      color: var(--pastel-lila);
      font-family: var(--font-romantic);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.9);
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(6px);
    }
    .icon-node:hover .tooltip { opacity: 1; transform: translateY(0); }

    .magic-spark {
      position: absolute;
      pointer-events: none;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 10px var(--soft-violet);
    }

    /* MODAL POLAROID - CENTRADO ABSOLUTO */
    .modal-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(5, 3, 10, 0.92);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 15px;
    }
    
    .modal-overlay.active { 
      opacity: 1; 
      visibility: visible; 
    }

    .polaroid-wrapper {
      position: relative;
      transform: scale(0.85) translateZ(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: transform;
      max-width: 100%;
      display: flex;
      justify-content: center;
    }

    .modal-overlay.active .polaroid-wrapper { 
      transform: scale(1) translateZ(0); 
    }

    .polaroid {
      background: #120a1f;
      border: 1px solid rgba(216, 180, 254, 0.35);
      padding: 20px 20px 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(168, 85, 247, 0.2);
      width: 400px;
      max-width: 90vw;
      text-align: center;
      border-radius: 12px;
      margin: auto;
    }

    .polaroid-img {
      width: 100%; 
      height: 250px;
      object-fit: cover;
      margin-bottom: 15px;
      border: 1px solid rgba(216, 180, 254, 0.25);
      border-radius: 6px;
    }

    .polaroid-title {
      font-family: var(--font-romantic);
      font-size: 24px;
      color: var(--pastel-lila);
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .polaroid-desc {
      font-family: var(--font-body);
      font-size: 13px;
      color: #e9d5ff;
      line-height: 1.5;
      margin-bottom: 14px;
      font-weight: 300;
    }

    .polaroid-footer {
      font-family: var(--font-romantic);
      font-size: 17px;
      color: #f472b6;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 1.2px;
      border-top: 1px dashed rgba(216, 180, 254, 0.25);
      padding-top: 10px;
    }

    .close-modal {
      position: absolute;
      top: -45px; right: 0px;
      background: none; border: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 36px; font-weight: 100;
      cursor: pointer; 
      transition: color 0.3s ease, transform 0.3s ease;
      padding: 5px;
      line-height: 1;
    }
    .close-modal:hover { color: var(--pastel-lila); transform: rotate(90deg); }

    /* ANIMACIONES LIGERAS */
    @keyframes spaceGlowIntro {
      0% { opacity: 1; transform: scale(0.5); }
      100% { opacity: 0; transform: scale(1.8); }
    }

    @keyframes cosmicReveal {
      from { opacity: 0; transform: scale(0.9) translateZ(0); }
      to { opacity: 1; transform: scale(1) translateZ(0); }
    }

    @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* REGULACIÓN Y FLUIDEZ EN CELULARES */
    @media (max-width: 768px) {
      body {
        justify-content: space-between;
        padding: 12px 8px 20px 8px;
      }

      /* Baja el título para dar espacio holgado al botón Volver */
      .header-container { 
        margin-top: 55px !important; 
        margin-bottom: 0; 
      }
      .special-title { font-size: 1.8rem; letter-spacing: 1px; }
      .special-subtitle { font-size: 0.9rem; }

      .volver-inicio {
        top: 12px;
        left: 12px;
        padding: 7px 14px;
        font-size: 0.78rem;
      }

      .graphic-container {
        aspect-ratio: 1 / 1.3;
        width: 100vw;
        height: 60vh;
        max-height: 500px;
        margin: auto;
      }

      .brain-inner { width: 85px; height: 85px; }
      .heart-center-text { font-size: 0.8rem; }
      
      .icon-node { width: 56px; height: 56px; }
      .icon-node svg { width: 22px; height: 22px; }
      
      .tooltip { 
        font-size: 11px; 
        top: -28px; 
        opacity: 0.9; 
        transform: translateY(0); 
      }
      
      .polaroid { width: 310px; padding: 14px 14px 18px 14px; }
      .polaroid-img { height: 180px; margin-bottom: 10px; }
      .polaroid-title { font-size: 20px; }
      .polaroid-desc { font-size: 11.5px; line-height: 1.45; margin-bottom: 10px; }
      .polaroid-footer { font-size: 14px; padding-top: 8px; }
    }
  </style>
</head>

  <!-- TITULO Y SUBTITULO DE LA OPCION B TAL CUAL -->

    <div class="brain-wrapper">

  <script>
  // --- 1. BIG BANG DE PARTÍCULAS INICIAL ---
(function initPureParticleBigBang() {
  const bbCanvas = document.createElement('canvas');
  bbCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;background:transparent;';
  document.body.appendChild(bbCanvas);

  const bbCtx = bbCanvas.getContext('2d');
  let bbW = (bbCanvas.width = window.innerWidth);
  let bbH = (bbCanvas.height = window.innerHeight);

  const bbParticles = [];
  const colors = ['#a855f7', '#d8b4fe', '#f472b6', '#ffffff'];
  const particleCount = window.innerWidth < 768 ? 400 : 800; // Optimizado para celulares

  for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 400 + 150;

    bbParticles.push({
      x: Math.cos(angle) * radius,
      y: Math.sin(angle) * radius,
      z: Math.random() * 3000 + 100,
      vz: -(Math.random() * 45 + 25),
      size: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
    });
  }

  function renderBigBang() {
    bbCtx.clearRect(0, 0, bbW, bbH);
    let active = false;
    const cx = bbW / 2;
    const cy = bbH / 2;
    const fov = 500;

    bbParticles.forEach((p) => {
      p.z += p.vz;
      if (p.z > 0) {
        active = true;
        const scale = fov / p.z;
        const x2d = cx + p.x * scale;
        const y2d = cy + p.y * scale;
        const r = p.size * scale;

        if (x2d > -100 && x2d < bbW + 100 && y2d > -100 && y2d < bbH + 100) {
          bbCtx.beginPath();
          bbCtx.arc(x2d, y2d, Math.max(0.1, r), 0, Math.PI * 2);
          bbCtx.fillStyle = p.color;
          bbCtx.shadowBlur = 10;
          bbCtx.shadowColor = p.color;
          bbCtx.fill();
        }
      }
    });

    if (active) {
      requestAnimationFrame(renderBigBang);
    } else {
      bbCanvas.remove(); // Limpieza de DOM al finalizar
    }
  }
  
  requestAnimationFrame(renderBigBang);

  window.addEventListener('resize', () => {
    bbW = bbCanvas.width = window.innerWidth;
    bbH = bbCanvas.height = window.innerHeight;
  });
})();

// --- 2. FONDO DE RED NEURONAL INTERACTIVA ---
const canvas = document.getElementById('neural-bg');
const ctx = canvas.getContext('2d');
let width, height, particles;

function initNeuralBackground() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  particles = [];
  
  // Ajuste dinámico según rendimiento/pantalla
  const divisor = width < 768 ? 16000 : 9000;
  const particleCount = Math.floor((width * height) / divisor);

  for (let i = 0; i < particleCount; i++) {
    particles.push(new Neuron());
  }
}

class Neuron {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.35;
    this.vy = (Math.random() - 0.5) * 0.35;
    this.radius = Math.random() * 1.5 + 0.5;
    this.isPink = Math.random() > 0.6;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.isPink ? '#f472b6' : '#d8b4fe';
    ctx.fill();
  }
}

function animateNeuralNetwork() {
  ctx.clearRect(0, 0, width, height);
  const maxDistance = width < 768 ? 85 : 110;

  for (let i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw();

    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < maxDistance) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        const opacity = 1 - dist / maxDistance;
        ctx.strokeStyle = `rgba(168, 85, 247, ${opacity * 0.25})`;
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animateNeuralNetwork);
}

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(initNeuralBackground, 200);
});

initNeuralBackground();
animateNeuralNetwork();

// --- 3. INTERACCIONES, RUTA DE SINAAPSIS Y MODAL ---
document.addEventListener('DOMContentLoaded', () => {
  const nodes = document.querySelectorAll('.icon-node');
  const brain = document.getElementById('main-brain');
  const modal = document.getElementById('memory-modal');
  const modalImg = document.getElementById('modal-img');
  const modalTitle = document.getElementById('modal-title');
  const modalDesc = document.getElementById('modal-desc');
  const closeModalBtn = document.getElementById('close-modal');
  const mainView = document.getElementById('main-view') || document.body;

  let isAnimating = false;

  // Creador de destellos mágicos
  const createMagicSparkles = (x, y) => {
    const symbols = ['✨', '💜', '🌸', '⋆'];
    const sparkCount = window.innerWidth < 768 ? 20 : 35;

    for (let i = 0; i < sparkCount; i++) {
      const particle = document.createElement('div');
      particle.classList.add('magic-spark');
      particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      particle.style.color = Math.random() > 0.4 ? '#a855f7' : '#d8b4fe';
      particle.style.fontSize = `${Math.random() * 14 + 8}px`;
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      mainView.appendChild(particle);

      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 90 + 30;
      const destinationX = Math.cos(angle) * velocity;
      const destinationY = Math.sin(angle) * velocity - 20;
      const rotation = (Math.random() - 0.5) * 180;

      particle
        .animate(
          [
            { transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', opacity: 0 },
            { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1, offset: 0.2 },
            {
              transform: `translate(calc(-50% + ${destinationX}px), calc(-50% + ${destinationY}px)) scale(0.4) rotate(${rotation}deg)`,
              opacity: 0,
            },
          ],
          {
            duration: Math.random() * 1200 + 800,
            easing: 'ease-out',
            delay: Math.random() * 80,
          }
        )
        .onfinish = () => particle.remove();
    }
  };

  // Evento Click en Nodos
  nodes.forEach((node) => {
    node.addEventListener('click', () => {
      if (isAnimating) return;
      isAnimating = true;

      const imgUrl = node.getAttribute('data-img');
      const title = node.getAttribute('data-title');
      const desc = node.getAttribute('data-desc');
      const pathId = node.getAttribute('data-path');

      if (brain) brain.classList.add('active');

      // Animación de Línea Principal
      const pulsePath = document.getElementById(pathId);
      if (pulsePath) {
        const length = pulsePath.getTotalLength();
        pulsePath.style.transition = 'none';
        pulsePath.style.strokeDasharray = length;
        pulsePath.style.strokeDashoffset = length;
        pulsePath.style.opacity = '1';
        pulsePath.getBoundingClientRect(); // Trigger Reflow

        pulsePath.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(0.4, 0, 0.2, 1)';
        pulsePath.style.strokeDashoffset = '0';
      }

      // Animación de Ramificaciones Secundarias
      const branchesGroup = document.getElementById('branches-' + pathId);
      let branchPaths = [];
      if (branchesGroup) {
        branchPaths = Array.from(branchesGroup.querySelectorAll('.connection-branch'));
        branchPaths.forEach((branch, index) => {
          const branchLength = branch.getTotalLength();
          branch.style.transition = 'none';
          branch.style.strokeDasharray = branchLength;
          branch.style.strokeDashoffset = branchLength;
          branch.style.opacity = '1';
          branch.getBoundingClientRect(); // Trigger Reflow

          const delay = 0.3 + index * 0.25;
          branch.style.transition = `stroke-dashoffset 0.6s ease-out ${delay}s`;
          branch.style.strokeDashoffset = '0';
        });
      }

      // Apertura de Polaroid + Destellos
      setTimeout(() => {
        const rectNode = node.getBoundingClientRect();
        const rectView = mainView.getBoundingClientRect();
        createMagicSparkles(
          rectNode.left - rectView.left + rectNode.width / 2,
          rectNode.top - rectView.top + rectNode.height / 2
        );

        if (pulsePath) {
          pulsePath.style.transition = 'opacity 0.5s ease';
          pulsePath.style.opacity = '0';
        }
        branchPaths.forEach((branch) => {
          branch.style.transition = 'opacity 0.5s ease';
          branch.style.opacity = '0';
        });

        if (modalImg) modalImg.src = imgUrl;
        if (modalTitle) modalTitle.innerText = title;
        if (modalDesc) modalDesc.innerText = desc;
        if (modal) modal.classList.add('active');

        setTimeout(() => {
          if (brain) brain.classList.remove('active');
          isAnimating = false;
        }, 300);
      }, 1300);
    });
  });

  // Cerrar Modal
  const closePhoto = () => {
    if (modal) modal.classList.remove('active');
    setTimeout(() => {
      if (modalImg) modalImg.src = '';
    }, 400);
  };

  if (closeModalBtn) closeModalBtn.addEventListener('click', closePhoto);

  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closePhoto();
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal && modal.classList.contains('active')) closePhoto();
  });
});
  </script>
