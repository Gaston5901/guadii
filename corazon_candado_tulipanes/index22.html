<!doctype html>
<html lang="es" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulipanes Espaciales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Dancing+Script:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }

    .volver-inicio{
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.50);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .volver-inicio:hover{ transform: translateY(-1px); background: rgba(0,0,0,.66); }

    :root {
      --bg-space: #0a0a1a;
      --star-color: #fff8e7;
      --tulip-pink: #ff6b9d;
      --tulip-red: #e63946;
      --text-light: #f8f4ff;
    }
    
    .space-bg {
      background: radial-gradient(ellipse at bottom, #1a1a3e 0%, #0a0a1a 50%, #050510 100%);
    }
    
    /* Estrellas */
    .star {
      position: absolute;
      background: var(--star-color);
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      box-shadow: 0 0 6px 2px rgba(255, 248, 231, 0.3);
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    .shooting-star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: linear-gradient(45deg, #fff, transparent);
      border-radius: 50%;
      animation: shoot 3s ease-in-out infinite;
      opacity: 0;
    }
    
    .shooting-star::after {
      content: '';
      position: absolute;
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
      transform: translateX(-100%);
      top: 1px;
    }
    
    @keyframes shoot {
      0% { transform: translateX(0) translateY(0); opacity: 0; }
      5% { opacity: 1; }
      30% { transform: translateX(300px) translateY(200px); opacity: 0; }
      100% { opacity: 0; }
    }
    
    /* Nebulosas */
    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.1); }
    }
    
    /* Tulipanes */
    .tulip-container {
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
    }
    
    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      background: linear-gradient(90deg, 
        #2a4514 0%, 
        #3d6020 20%, 
        #4a7c23 40%,
        #5a8c33 50%,
        #4a7c23 60%,
        #3d6020 80%,
        #2a4514 100%);
      border-radius: 4px;
      transform-origin: bottom center;
      animation: sway var(--sway-duration) ease-in-out infinite;
      box-shadow: 
        inset -3px 0 5px rgba(0,0,0,0.5),
        inset 3px 0 5px rgba(120,180,70,0.25),
        inset 0 -3px 8px rgba(0,0,0,0.3),
        3px 3px 12px rgba(0,0,0,0.4);
      filter: contrast(1.1) saturate(1.2);
    }
    
    .stem::before {
      content: '';
      position: absolute;
      left: 60%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to top, 
        transparent 0%,
        rgba(180,220,120,0.3) 20%,
        rgba(200,240,140,0.5) 50%,
        rgba(180,220,120,0.3) 80%,
        transparent 100%);
      border-radius: 1px;
      filter: blur(0.5px);
    }
    
    .stem::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 0;
      background: repeating-linear-gradient(to top,
        transparent,
        transparent 15px,
        rgba(0,0,0,0.08) 15px,
        rgba(0,0,0,0.08) 16px);
      border-radius: 4px;
    }
    
    .stem-segment {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.15),
        transparent 30%,
        transparent 70%,
        rgba(0,0,0,0.15));
      transform: scaleX(1.1);
    }
    
    .stem-texture {
      position: absolute;
      left: 20%;
      width: 60%;
      height: 100%;
      background: 
        repeating-linear-gradient(to top,
          transparent,
          transparent 8px,
          rgba(90,140,51,0.2) 8px,
          rgba(90,140,51,0.2) 9px),
        repeating-linear-gradient(45deg,
          transparent,
          transparent 3px,
          rgba(0,0,0,0.03) 3px,
          rgba(0,0,0,0.03) 4px);
      pointer-events: none;
    }
    
    @keyframes sway {
      0%, 100% { transform: translateX(-50%) rotate(var(--sway-start)); }
      50% { transform: translateX(-50%) rotate(var(--sway-end)); }
    }
    
    .tulip-head {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      animation: bloom 2s ease-out forwards, gentle-bob 4s ease-in-out infinite 2s;
    }
    
    @keyframes bloom {
      0% { transform: translateX(-50%) scale(0) rotate(-10deg); opacity: 0; }
      60% { transform: translateX(-50%) scale(1.1) rotate(5deg); }
      100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
    }
    
    @keyframes gentle-bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }
    
    .petal {
      position: absolute;
      border-radius: 50% 50% 25% 25%;
      transform-origin: bottom center;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
      overflow: hidden;
      animation: sway var(--sway-duration, 4s) ease-in-out infinite;
      /* El color se mejora en el JS */
    }
    
    .petal::before {
      content: '';
      position: absolute;
      top: -5%;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 70%;
      background: linear-gradient(to bottom, 
        rgba(255,255,255,0.9) 0%, 
        rgba(255,255,255,0.5) 40%,
        transparent 100%);
      border-radius: 50%;
      filter: blur(12px);
    }
    
    .petal::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 35%;
      background: linear-gradient(to top, 
        rgba(0,0,0,0.25) 0%, 
        rgba(0,0,0,0.08) 50%,
        transparent 100%);
      border-radius: 0 0 25% 25%;
    }
    
    .petal-center {
      width: 32px;
      height: 52px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      border-radius: 50% 50% 15% 15%;
    }
    
    .petal-left {
      width: 28px;
      height: 48px;
      left: 12%;
      transform: rotate(-25deg);
      z-index: 2;
    }
    
    .petal-right {
      width: 28px;
      height: 48px;
      right: 12%;
      transform: rotate(25deg);
      z-index: 2;
    }
    
    .petal-back-left {
      width: 24px;
      height: 42px;
      left: -5%;
      transform: rotate(-40deg);
      z-index: 1;
      opacity: 0.85;
    }
    
    .petal-back-right {
      width: 24px;
      height: 42px;
      right: -5%;
      transform: rotate(40deg);
      z-index: 1;
      opacity: 0.85;
    }
    
    /* Centro del tulipán */
    .tulip-center {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      background: radial-gradient(circle, #2a3d1a, #1a2410);
      border-radius: 50%;
      z-index: 4;
      box-shadow: 
        inset 0 2px 4px rgba(0,0,0,0.6),
        0 0 8px rgba(255,220,100,0.3);
    }
    
    .tulip-center::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: #ffdc64;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffdc64;
    }
    
    /* Estambres */
    .stamen {
      position: absolute;
      width: 2px;
      height: 12px;
      background: linear-gradient(to top, #4a5d2a, #6a7d4a);
      border-radius: 1px;
      bottom: 5px;
      transform-origin: bottom center;
    }
    
    .stamen::after {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 4px #ffd700;
    }
    
    .leaf {
      position: absolute;
      background: linear-gradient(135deg, #2d5016 0%, #4a7c23 30%, #5a9c2e 60%, #6aac3e 100%);
      border-radius: 0 80% 0 80%;
      transform-origin: bottom left;
      animation: leaf-grow 1.5s ease-out forwards;
      box-shadow: 
        inset -2px 2px 6px rgba(0,0,0,0.3),
        inset 2px -2px 6px rgba(120,180,70,0.2),
        3px 3px 10px rgba(0,0,0,0.3);
    }
    
    .leaf::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      background: linear-gradient(135deg, transparent 40%, rgba(150,200,90,0.3) 50%, transparent 60%);
      border-radius: 0 80% 0 80%;
      pointer-events: none;
    }
    
    .leaf::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(to right, #2d5016, #5a9c2e, #6aac3e);
      transform: translateY(-50%) rotate(-20deg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    
    .leaf-right {
      border-radius: 80% 0 80% 0;
      transform-origin: bottom right;
      background: linear-gradient(225deg, #2d5016 0%, #4a7c23 30%, #5a9c2e 60%, #6aac3e 100%);
    }
    
    .leaf-right::before {
      border-radius: 80% 0 80% 0;
      background: linear-gradient(225deg, transparent 40%, rgba(150,200,90,0.3) 50%, transparent 60%);
    }
    
    .leaf-right::after {
      transform: translateY(-50%) rotate(20deg);
    }
    
    @keyframes leaf-grow {
      0% { transform: scale(0) rotate(0deg); }
      100% { transform: scale(1) rotate(var(--leaf-rotation)); }
    }
    
    /* Partículas brillantes */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      animation: sparkle-float 3s ease-in-out infinite;
      box-shadow: 0 0 10px 2px rgba(255, 107, 157, 0.5);
    }
    
    @keyframes sparkle-float {
      0%, 100% { 
        transform: translateY(0) scale(1); 
        opacity: 0.5; 
      }
      50% { 
        transform: translateY(-30px) scale(1.5); 
        opacity: 1; 
      }
    }
    
    /* Título */
    .title-glow {
      text-shadow: 
        0 0 12px rgba(255, 107, 157, 0.7),
        0 0 28px rgba(157, 78, 221, 0.35),
        0 4px 10px rgba(0,0,0,0.45);
      /* Sin animación: título permanente y estable */
      animation: none !important;
    }
    
    @keyframes title-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; text-shadow: 
        0 0 15px rgba(255, 107, 157, 0.7),
        0 0 30px rgba(255, 107, 157, 0.5),
        0 0 60px rgba(255, 107, 157, 0.3); }
    }
    
    /* Fireflies */
    .firefly {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #fffbe6 0%, transparent 70%);
      border-radius: 50%;
      animation: firefly-move 8s ease-in-out infinite;
      box-shadow: 0 0 15px 5px rgba(255, 251, 230, 0.4);
    }
    
    @keyframes firefly-move {
      0%, 100% { 
        transform: translate(0, 0); 
        opacity: 0.3; 
      }
      25% { 
        transform: translate(50px, -30px); 
        opacity: 1; 
      }
      50% { 
        transform: translate(20px, -60px); 
        opacity: 0.5; 
      }
      75% { 
        transform: translate(-30px, -20px); 
        opacity: 0.8; 
      }
    }
    
    /* Ground glow */
    .ground-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: linear-gradient(to top, 
        rgba(45, 80, 22, 0.4) 0%, 
        rgba(45, 80, 22, 0.2) 30%,
        transparent 100%);
      pointer-events: none;
    }
    
    /* Nombre con estrellas */
    .star-name-container {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
    }
    
    .letter-star {
      position: absolute;
      background: radial-gradient(circle, #fff 0%, #ffd700 40%, #ff9500 70%, transparent 100%);
      border-radius: 50%;
      animation: star-pulse 2s ease-in-out infinite;
      opacity: 0;
      animation: star-appear 0.8s ease-out forwards, star-pulse 2s ease-in-out infinite 0.8s;
    }
    
    .letter-star::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      box-shadow: 0 0 15px #ffd700;
    }
    
    .letter-star::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      width: 150%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      box-shadow: 0 0 15px #ffd700;
    }
    
    @keyframes star-appear {
      0% { 
        opacity: 0; 
        transform: scale(0) rotate(0deg);
      }
      70% {
        transform: scale(1.3) rotate(180deg);
      }
      100% { 
        opacity: 1; 
        transform: scale(1) rotate(360deg);
      }
    }
    
    @keyframes star-pulse {
      0%, 100% { 
        filter: brightness(1) drop-shadow(0 0 10px #ffd700);
      }
      50% { 
        filter: brightness(1.5) drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 40px #ff9500);
      }
    }
    
    .star-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,0.3), transparent 70%);
      pointer-events: none;
      animation: glow-pulse 2s ease-in-out infinite;
    }
    
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }
    /* Video modal y botón central (corazón) */
    .video-trigger-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 40;
    }
    .video-trigger {
      pointer-events: auto;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, rgba(255,180,200,0.95), rgba(255,107,157,0.95)), linear-gradient(135deg, #ff6b9d, #9d4edd);
      border: 3px solid rgba(255,255,255,0.12);
      box-shadow: 0 16px 50px rgba(157,78,221,0.22), 0 8px 26px rgba(255,107,157,0.16);
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease;
      backdrop-filter: blur(6px);
      position: relative;
      animation: heartbeat 2s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      10% { transform: scale(1.06); }
      30% { transform: scale(0.98); }
      50% { transform: scale(1.04); }
    }
    .video-trigger:hover { transform: translateY(-6px) scale(1.03); }
    .video-trigger svg { width: 72px; height: 72px; display: block; }
    .video-trigger .play { filter: drop-shadow(0 8px 22px rgba(0,0,0,0.45)); }

    .video-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3,6,23,0.78);
      z-index: 60;
      padding: 24px;
    }
    .video-modal.active { display: flex; }
    .video-modal-content {
      max-width: 1100px;
      width: 100%;
      background: linear-gradient(180deg, rgba(10,10,20,0.98), rgba(6,6,12,0.95));
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 30px 90px rgba(2,6,23,0.7);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .video-frame {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .video-frame video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      max-height: 80vh;
      background: #000;
      display: block;
      touch-action: manipulation;
    }
    .video-controls {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2px 4px 0;
    }
    .video-control-btn {
      border: none;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, rgba(255,107,157,0.98), rgba(157,78,221,0.98));
      box-shadow: 0 10px 24px rgba(157,78,221,0.22);
      border-radius: 999px;
      min-width: 44px;
      min-height: 44px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .video-control-btn:active { transform: scale(0.98); }
    .video-play-btn { min-width: 92px; }
    .video-time {
      color: rgba(255,255,255,0.8);
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      min-width: 78px;
      text-align: center;
    }
    .video-seek {
      flex: 1 1 220px;
      min-width: 180px;
      accent-color: #ff6b9d;
      height: 28px;
      touch-action: pan-x;
    }
    .video-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
    }
    @media (max-width: 640px) {
      .video-trigger { width: 88px; height: 88px; }
      .video-trigger svg { width: 56px; height: 56px; }
      .video-modal-content { padding: 10px; border-radius: 10px; }
      .video-controls { gap: 8px; }
      .video-control-btn { min-width: 42px; min-height: 42px; padding: 0 12px; }
      .video-play-btn { min-width: 84px; }
      .video-time { font-size: 0.85rem; min-width: 70px; }
      .video-seek { flex-basis: 100%; min-width: 0; }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full m-0 p-0 overflow-hidden">
  <a class="volver-inicio" href="../index.html" aria-label="Volver al inicio">← </a>
  <div id="app" class="w-full h-full space-bg relative overflow-hidden"><!-- Nebulosas de fondo -->
   <div class="nebula" style="width: 400px; height: 400px; background: #ff6b9d; top: 10%; left: 10%;"></div>
   <div class="nebula" style="width: 300px; height: 300px; background: #9d4edd; top: 20%; right: 15%; animation-delay: -5s;"></div>
   <div class="nebula" style="width: 350px; height: 350px; background: #4cc9f0; bottom: 30%; left: 30%; animation-delay: -10s;"></div><!-- Contenedor de estrellas -->
   <div id="stars-container"></div><!-- Estrellas fugaces -->
   <div class="shooting-star" style="top: 15%; left: 20%;"></div>
   <div class="shooting-star" style="top: 25%; left: 60%; animation-delay: 1.5s;"></div>
   <div class="shooting-star" style="top: 10%; left: 40%; animation-delay: 4s;"></div><!-- Nombre con estrellas -->
  <!-- <div id="star-name-container" class="star-name-container"></div> --><!-- Título -->
   <div class="absolute top-8 left-0 right-0 text-center z-20">
    <h1 id="main-title" class="title-glow text-5xl md:text-7xl font-bold" style="font-family: 'Dancing Script', cursive; color: var(--text-light);">Guadiss</h1>
    <p class="mt-4 text-lg md:text-xl opacity-70" style="color: var(--text-light); font-family: 'Playfair Display', serif;">✨ Tu jardin de Tulipanes ✨</p>
   </div><!-- Contenedor de tulipanes -->
   <div id="tulips-container"></div><!-- Luciérnagas -->
   <!-- Botón central para reproducir video -->
   <div class="video-trigger-container" aria-hidden="false">
     <button id="video-trigger" class="video-trigger" aria-label="Ver video promocional" title="Toca para ver">
       <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false" role="img">
         <!-- Corazón -->
         <path d="M32 56s-22-13.6-22-28A11 11 0 0 1 32 18a11 11 0 0 1 22 10c0 14.4-22 28-22 28z" fill="#fff" opacity="0.08"></path>
         <path d="M32 52s-18-11-18-23a9 9 0 0 1 18-6 9 9 0 0 1 18 6c0 12-18 23-18 23z" fill="url(#g)"/>
         <defs>
           <linearGradient id="g" x1="0" x2="1">
             <stop offset="0%" stop-color="#ff9aa8"/>
             <stop offset="50%" stop-color="#ff6b9d"/>
             <stop offset="100%" stop-color="#9d4edd"/>
           </linearGradient>
         </defs>
         <!-- Triángulo de play -->
         <polygon class="play" points="26,20 26,44 46,32" fill="#fff" opacity="0.95"/>
       </svg>
     </button>
   </div>
   <div id="fireflies-container"></div><!-- Brillo del suelo -->
   <div class="ground-glow"></div><!-- Partículas brillantes -->
   <div id="sparkles-container"></div>
  </div>
  <script>
    const defaultConfig = {
      title_text: 'Jardín Estelar de Tulipanes',
      primary_color: '#ff6b9d',
      secondary_color: '#e63946',
      bg_color: '#0a0a1a',
      text_color: '#f8f4ff',
      accent_color: '#9d4edd',
      font_family: 'Dancing Script',
      font_size: 48
    };

    // Colores de tulipanes
    const tulipColors = [
      { main: '#ff6b9d', dark: '#e5547f', light: '#ff8fb3' },
      { main: '#e63946', dark: '#c62a36', light: '#ff5c6a' },
      { main: '#9d4edd', dark: '#7b2cbf', light: '#b76eeb' },
      { main: '#ff9e7d', dark: '#e87d5a', light: '#ffb8a0' },
      { main: '#f72585', dark: '#d41c6e', light: '#ff4d9e' },
      { main: '#4cc9f0', dark: '#3aa8cc', light: '#7dd8f5' },
      { main: '#ffd166', dark: '#e6b84d', light: '#ffe08a' }
    ];

    // Crear estrellas
    function createStars() {
      const container = document.getElementById('stars-container');
      container.innerHTML = '';
      const starCount = 150;
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 70}%`;
        const size = Math.random() * 3 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
        star.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(star);
      }
    }

    // Crear tulipanes
    function createTulips() {
      const container = document.getElementById('tulips-container');
      container.innerHTML = '';
      const tulipCount = 12;
      
      for (let i = 0; i < tulipCount; i++) {
        const color = tulipColors[Math.floor(Math.random() * tulipColors.length)];
        const tulip = createTulip(color, i, tulipCount);
        container.appendChild(tulip);
      }
    }

    function createTulip(color, index, total) {
      const container = document.createElement('div');
      container.className = 'tulip-container';

      const spacing = 100 / (total + 1);
      const xPos = spacing * (index + 1);
      const stemHeight = 120 + Math.random() * 100;
      const delay = index * 0.2;

      container.style.left = `${xPos}%`;
      container.style.zIndex = Math.floor(Math.random() * 10);

      // Tallo
      const stem = document.createElement('div');
      stem.className = 'stem';
      stem.style.height = `${stemHeight}px`;
      // Animación del tallo (menos movimiento)
      const swayDuration = 3 + Math.random() * 2;
      const swayStart = -0.5 - Math.random() * 0.5;
      const swayEnd = 0.5 + Math.random() * 0.5;
      stem.style.setProperty('--sway-duration', `${swayDuration}s`);
      stem.style.setProperty('--sway-start', `${swayStart}deg`);
      stem.style.setProperty('--sway-end', `${swayEnd}deg`);
      stem.style.animationDelay = `${Math.random() * 2}s`;

      // Agregar textura al tallo
      const stemTexture = document.createElement('div');
      stemTexture.className = 'stem-texture';
      stem.appendChild(stemTexture);

      // Agregar segmentos al tallo (nudos)
      const segmentCount = Math.floor(stemHeight / 40);
      for (let j = 1; j <= segmentCount; j++) {
        const segment = document.createElement('div');
        segment.className = 'stem-segment';
        segment.style.bottom = `${(stemHeight / (segmentCount + 1)) * j}px`;
        stem.appendChild(segment);
      }

      container.appendChild(stem);

      // Hojas
      const leaf1 = document.createElement('div');
      leaf1.className = 'leaf';
      leaf1.style.width = '45px';
      leaf1.style.height = '75px';
      leaf1.style.bottom = `${stemHeight * 0.25}px`;
      leaf1.style.left = '50%';
      leaf1.style.setProperty('--leaf-rotation', '-50deg');
      leaf1.style.animationDelay = `${delay + 0.5}s`;
      container.appendChild(leaf1);

      const leaf2 = document.createElement('div');
      leaf2.className = 'leaf leaf-right';
      leaf2.style.width = '40px';
      leaf2.style.height = '65px';
      leaf2.style.bottom = `${stemHeight * 0.45}px`;
      leaf2.style.right = '50%';
      leaf2.style.left = 'auto';
      leaf2.style.setProperty('--leaf-rotation', '45deg');
      leaf2.style.animationDelay = `${delay + 0.8}s`;
      container.appendChild(leaf2);

      // Tercera hoja opcional
      if (Math.random() > 0.5) {
        const leaf3 = document.createElement('div');
        leaf3.className = 'leaf';
        leaf3.style.width = '35px';
        leaf3.style.height = '55px';
        leaf3.style.bottom = `${stemHeight * 0.6}px`;
        leaf3.style.left = '50%';
        leaf3.style.setProperty('--leaf-rotation', '-35deg');
        leaf3.style.animationDelay = `${delay + 1.1}s`;
        container.appendChild(leaf3);
      }

      // Cabeza del tulipán
      const head = document.createElement('div');
      head.className = 'tulip-head';
      head.style.width = '80px';
      head.style.height = '58px';
      head.style.bottom = `${stemHeight}px`;
      head.style.animationDelay = `${delay}s`;

      // Pétalos
      const petalClasses = ['petal-back-left', 'petal-back-right', 'petal-left', 'petal-right', 'petal-center'];
      petalClasses.forEach(cls => {
        const petal = document.createElement('div');
        petal.className = `petal ${cls}`;
        petal.style.background = `
          radial-gradient(circle at 60% 20%, ${color.light} 0%, transparent 60%),
          linear-gradient(to top, 
            ${color.dark} 0%, 
            ${color.main} 30%,
            ${color.light} 60%,
            ${color.main} 90%,
            ${color.dark} 100%)`;
        petal.style.boxShadow = `
          0 8px 24px ${color.main}40,
          0 2px 8px ${color.light}80,
          inset 0 -18px 28px rgba(0,0,0,0.25),
          inset 0 18px 24px rgba(255,255,255,0.18),
          inset -10px 0 18px rgba(0,0,0,0.12),
          inset 10px 0 18px rgba(255,255,255,0.08)`;
        // Animación de pétalos igual que el tallo
        petal.style.setProperty('--sway-duration', `${swayDuration}s`);
        petal.style.setProperty('--sway-start', `${swayStart}deg`);
        petal.style.setProperty('--sway-end', `${swayEnd}deg`);
        petal.style.animationDelay = `${delay}s`;
        head.appendChild(petal);
      });

      // Centro del tulipán con estambres
      const center = document.createElement('div');
      center.className = 'tulip-center';
      head.appendChild(center);

      // Crear 6 estambres alrededor del centro
      for (let i = 0; i < 6; i++) {
        const stamen = document.createElement('div');
        stamen.className = 'stamen';
        const angle = (i * 60) - 30;
        stamen.style.left = `${50 + Math.cos(angle * Math.PI / 180) * 6}%`;
        stamen.style.transform = `rotate(${angle}deg)`;
        center.appendChild(stamen);
      }

      container.appendChild(head);

      return container;
    }

    // Crear luciérnagas
    function createFireflies() {
      const container = document.getElementById('fireflies-container');
      container.innerHTML = '';
      const count = 15;
      
      for (let i = 0; i < count; i++) {
        const firefly = document.createElement('div');
        firefly.className = 'firefly';
        firefly.style.left = `${10 + Math.random() * 80}%`;
        firefly.style.bottom = `${10 + Math.random() * 40}%`;
        firefly.style.animationDelay = `${Math.random() * 8}s`;
        firefly.style.animationDuration = `${6 + Math.random() * 4}s`;
        container.appendChild(firefly);
      }
    }

    // Crear partículas brillantes
    function createSparkles() {
      const container = document.getElementById('sparkles-container');
      container.innerHTML = '';
      const count = 20;
      
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = `${5 + Math.random() * 90}%`;
        sparkle.style.bottom = `${5 + Math.random() * 30}%`;
        sparkle.style.animationDelay = `${Math.random() * 3}s`;
        sparkle.style.background = tulipColors[Math.floor(Math.random() * tulipColors.length)].main;
        container.appendChild(sparkle);
      }
    }

    async function onConfigChange(config) {
      const titleElement = document.getElementById('main-title');
      if (titleElement) {
        titleElement.textContent = config.title_text || defaultConfig.title_text;
        const fontFamily = config.font_family || defaultConfig.font_family;
        titleElement.style.fontFamily = `${fontFamily}, cursive`;
        const fontSize = config.font_size || defaultConfig.font_size;
        titleElement.style.fontSize = `${fontSize}px`;
        titleElement.style.color = config.text_color || defaultConfig.text_color;
      }
      
      const app = document.getElementById('app');
      if (app) {
        const bgColor = config.bg_color || defaultConfig.bg_color;
        app.style.background = `radial-gradient(ellipse at bottom, ${adjustColor(bgColor, 40)} 0%, ${bgColor} 50%, ${adjustColor(bgColor, -10)} 100%)`;
      }
    }

    function adjustColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.min(255, Math.max(0, (num >> 16) + amt));
      const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
      const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
      return `#${(0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)}`;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.bg_color || defaultConfig.bg_color,
            set: (value) => {
              config.bg_color = value;
              window.elementSdk.setConfig({ bg_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => {
              config.primary_color = value;
              window.elementSdk.setConfig({ primary_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['title_text', config.title_text || defaultConfig.title_text]
      ]);
    }

    // Crear nombre "SOLCITO" con estrellas
    function createStarName() {
      const container = document.getElementById('star-name-container');
      if (!container) return;
      
      container.innerHTML = '';
      
      // Definir las letras con sus posiciones de estrellas
      const letters = {
        S: [
          [2,0], [3,0], [4,0],
          [1,1], 
          [2,2], [3,2],
          [4,3],
          [1,4], [2,4], [3,4]
        ],
        O: [
          [1,0], [2,0], [3,0],
          [0,1], [4,1],
          [0,2], [4,2],
          [0,3], [4,3],
          [1,4], [2,4], [3,4]
        ],
        L: [
          [0,0],
          [0,1],
          [0,2],
          [0,3],
          [0,4], [1,4], [2,4], [3,4]
        ],
        C: [
          [1,0], [2,0], [3,0],
          [0,1],
          [0,2],
          [0,3],
          [1,4], [2,4], [3,4]
        ],
        I: [
          [0,0], [1,0], [2,0],
          [1,1],
          [1,2],
          [1,3],
          [0,4], [1,4], [2,4]
        ],
        T: [
          [0,0], [1,0], [2,0], [3,0], [4,0],
          [2,1],
          [2,2],
          [2,3],
          [2,4]
        ]
      };
      
      const name = 'SOLCITO';
      const starSize = 12;
      const spacing = 8;
      const letterSpacing = 65;
      
      let currentX = 0;
      
      name.split('').forEach((letter, letterIndex) => {
        const points = letters[letter];
        if (!points) return;
        
        points.forEach((point, pointIndex) => {
          const [x, y] = point;
          const star = document.createElement('div');
          star.className = 'letter-star';
          star.style.width = `${starSize}px`;
          star.style.height = `${starSize}px`;
          star.style.left = `${currentX + (x * spacing)}px`;
          star.style.top = `${y * spacing}px`;
          star.style.animationDelay = `${letterIndex * 0.15 + pointIndex * 0.05}s`;
          
          // Glow adicional para cada estrella
          const glow = document.createElement('div');
          glow.className = 'star-glow';
          glow.style.width = `${starSize * 3}px`;
          glow.style.height = `${starSize * 3}px`;
          glow.style.left = `${currentX + (x * spacing) - starSize}px`;
          glow.style.top = `${y * spacing - starSize}px`;
          glow.style.animationDelay = `${letterIndex * 0.15 + pointIndex * 0.05}s`;
          
          container.appendChild(glow);
          container.appendChild(star);
        });
        
        currentX += letterSpacing;
      });
      
      // Centrar el contenedor
      const totalWidth = currentX - letterSpacing + 40;
      container.style.width = `${totalWidth}px`;
      container.style.marginLeft = `-${totalWidth / 2}px`;
    }
    
    // Inicializar
    function init() {
      createStars();
      createTulips();
      createFireflies();
      createSparkles();
      createStarName();
      
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities,
          mapToEditPanelValues
        });
      }
    }

    init();
  </script>

  <!-- Video modal -->
  <div id="video-modal" class="video-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="video-modal-content">
      <button id="video-close" class="video-close" aria-label="Cerrar video">✕</button>
      <div class="video-frame">
        <video id="promo-video" playsinline webkit-playsinline preload="metadata" style="width:100%;height:auto;border-radius:8px;max-height:80vh;background:#000;">
          <source src="video.mp4" type="video/mp4">
          Tu navegador no soporta video HTML5.
        </video>
      </div>
      <div class="video-controls" aria-label="Controles del video">
        <button id="video-back" class="video-control-btn" type="button" aria-label="Retroceder 10 segundos">-10</button>
        <button id="video-play" class="video-control-btn video-play-btn" type="button" aria-label="Reproducir o pausar">Pausar</button>
        <button id="video-forward" class="video-control-btn" type="button" aria-label="Adelantar 10 segundos">+10</button>
        <span id="video-time" class="video-time">0:00 / 0:00</span>
        <input id="video-seek" class="video-seek" type="range" min="0" max="1000" value="0" aria-label="Buscar en el video">
      </div>
    </div>
  </div>

  <script>
    (function(){
      const trigger = document.getElementById('video-trigger');
      const modal = document.getElementById('video-modal');
      const closeBtn = document.getElementById('video-close');
      const video = document.getElementById('promo-video');
      const playBtn = document.getElementById('video-play');
      const backBtn = document.getElementById('video-back');
      const forwardBtn = document.getElementById('video-forward');
      const seek = document.getElementById('video-seek');
      const timeLabel = document.getElementById('video-time');

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const total = Math.floor(seconds);
        const minutes = Math.floor(total / 60);
        const rest = String(total % 60).padStart(2, '0');
        return `${minutes}:${rest}`;
      }

      function syncControls() {
        if (!video) return;
        if (playBtn) playBtn.textContent = video.paused ? 'Reproducir' : 'Pausar';
        if (timeLabel) timeLabel.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        if (seek && Number.isFinite(video.duration) && video.duration > 0) {
          seek.value = String((video.currentTime / video.duration) * 1000);
        }
      }

      function playPause() {
        if (!video) return;
        if (video.paused) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
        syncControls();
      }

      function seekBy(seconds) {
        if (!video || !Number.isFinite(video.duration)) return;
        video.currentTime = Math.min(video.duration, Math.max(0, video.currentTime + seconds));
        syncControls();
      }

      function openVideo() {
        if (!modal) return;
        modal.classList.add('active');
        modal.setAttribute('aria-hidden', 'false');
        try { if (video.readyState === 0) video.load(); video.currentTime = 0; video.play().catch(()=>{}); } catch(e){}
        syncControls();
      }

      function closeVideo() {
        if (!modal) return;
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
        try { video.pause(); video.currentTime = 0; } catch(e){}
        syncControls();
      }

      if (trigger) trigger.addEventListener('click', openVideo);
      if (closeBtn) closeBtn.addEventListener('click', closeVideo);
      if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeVideo(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideo(); });

      if (playBtn) playBtn.addEventListener('click', playPause);
      if (backBtn) backBtn.addEventListener('click', () => seekBy(-10));
      if (forwardBtn) forwardBtn.addEventListener('click', () => seekBy(10));
      if (seek) {
        seek.addEventListener('input', () => {
          if (!video || !Number.isFinite(video.duration) || video.duration <= 0) return;
          video.currentTime = (Number(seek.value) / 1000) * video.duration;
          syncControls();
        });
      }

      if (video) {
        video.addEventListener('loadedmetadata', syncControls);
        video.addEventListener('timeupdate', syncControls);
        video.addEventListener('play', syncControls);
        video.addEventListener('pause', syncControls);
        video.addEventListener('ended', syncControls);
        video.addEventListener('click', playPause);
      }

    })();
  </script>
