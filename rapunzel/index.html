<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Vos ✨</title>
    <style>
        /* --- ESTILOS GENERALES Y FONDO --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #050510, #0b132b, #1c2541);
            font-family: 'Georgia', serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Capa para simular la profundidad del bosque oscuro */
        .forest-bg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40vh;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(5, 15, 25, 0));
            z-index: 2;
            pointer-events: none;
        }

        /* Siluetas de árboles simples */
        .forest-bg::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: repeat-x bottom;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,120 L0,90 L30,60 L45,75 L70,40 L90,65 L130,20 L160,70 L190,45 L240,100 L280,30 L320,80 L360,50 L420,110 L460,40 L500,85 L550,30 L600,90 L640,40 L690,80 L730,20 L780,95 L820,50 L880,110 L920,35 L970,80 L1010,15 L1060,85 L1110,40 L1160,90 L1200,50 L1200,120 Z" fill="%23020611"/></svg>');
            opacity: 0.8;
        }

        /* Estrellas de fondo parpadeantes */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
            animation: twinkle 10s infinite linear;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }

        /* --- LINTERNAS FLOTANTES --- */
        .lantern {
            position: absolute;
            bottom: -100px;
            width: 45px;
            height: 60px;
            background: linear-gradient(to bottom, #ffea88, #ffb84d);
            border-radius: 8px 8px 4px 4px;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.6), 
                0 0 40px rgba(255, 140, 0, 0.4),
                inset 0 -10px 15px rgba(255, 69, 0, 0.3);
            cursor: pointer;
            z-index: 5;
            animation: floatUp 15s linear infinite;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 22px;
            background: #ffffff;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ff4500, 0 0 4px #ffffff;
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-115vh) translateX(50px) rotate(10deg);
                opacity: 0;
            }
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

        /* --- FRASES FLOTANTES (EFECTO NUEVO) --- */
        .floating-phrase {
            position: absolute;
            color: #ffd700;
            font-size: clamp(1rem, 2.4vw, 1.25rem);
            font-style: italic;
            font-weight: bold;
            line-height: 1.35;
            max-width: min(240px, 72vw);
            padding: 0.45rem 0.65rem;
            background: rgba(5, 10, 20, 0.32);
            border: 1px solid rgba(255, 215, 0, 0.12);
            border-radius: 999px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 140, 0, 0.5);
            pointer-events: none;
            z-index: 10;
            text-align: center;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            transform: translate(-50%, -100%);
            transform-origin: center bottom;
            animation: floatPhrase 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatPhrase {
            0% {
                transform: translate(-50%, -100%) translateY(0) scale(0.8);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, -100%) translateY(-20px) scale(1);
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -100%) translateY(-120px) scale(0.95);
                opacity: 0;
            }
        }

        /* --- EFECTO EXPLOSIÓN --- */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffea88;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffb84d;
            pointer-events: none;
            z-index: 6;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }

        .instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
        }

        .intro-card {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            padding: 0.8rem 1.4rem;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(62, 16, 38, 0.32), rgba(17, 9, 26, 0.18));
            border: 1px solid rgba(255, 184, 204, 0.22);
            box-shadow: 0 0 18px rgba(255, 182, 193, 0.12), 0 0 34px rgba(255, 215, 0, 0.06);
            backdrop-filter: blur(5px);
            pointer-events: none;
            animation: introGlow 3s ease-in-out infinite;
        }

        .intro-name {
            color: #ffd6e7;
            font-size: clamp(2rem, 4.8vw, 3.2rem);
            font-weight: 600;
            font-style: italic;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.7), 0 0 28px rgba(255, 105, 180, 0.18);
            line-height: 1;
        }

        @keyframes introGlow {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.9; }
            50% { transform: translateX(-50%) translateY(-2px); opacity: 1; }
        }

        @media (max-width: 768px), (pointer: coarse) {
            body, html {
                height: 100dvh;
            }

            .stars {
                opacity: 0.28;
                background-size: 420px 420px, 280px 280px;
            }

            .forest-bg {
                height: 34vh;
            }

            .lantern {
                width: 34px;
                height: 46px;
                box-shadow:
                    0 0 14px rgba(255, 215, 0, 0.55),
                    0 0 24px rgba(255, 140, 0, 0.32),
                    inset 0 -8px 12px rgba(255, 69, 0, 0.22);
            }

            .lantern::after {
                width: 11px;
                height: 16px;
                bottom: 6px;
            }

            .floating-phrase {
                max-width: min(220px, 78vw);
                font-size: clamp(0.92rem, 4.8vw, 1.08rem);
                padding: 0.4rem 0.6rem;
            }

            .instruction {
                top: 14px;
                font-size: 0.72rem;
                letter-spacing: 1px;
                padding: 0 12px;
            }

            .intro-card {
                top: 46px;
                padding: 0.6rem 1rem;
            }

            .intro-name {
                font-size: clamp(1.7rem, 8.5vw, 2.6rem);
            }
        }

        .volver-inicio{
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,.85);
            border: 1px solid rgba(0,0,0,.10);
            color: #3b2f2f;
            text-decoration: none;
            font-weight: 800;
            box-shadow: 0 10px 26px rgba(0,0,0,.18);
        }
        .volver-inicio:hover{ transform: translateY(-1px); background: rgba(255,255,255,.95); }
    </style>
</head>
<body>
        <a class="volver-inicio" href="../index.html" aria-label="Volver al inicio">← </a>


    <div class="stars"></div>
    <div class="forest-bg"></div>
    <div class="intro-card" aria-hidden="true">
        <div class="intro-name">Iriss</div>
    </div>
    <div class="instruction">Toca las linternas flotantes</div>
    <audio id="musica" src="Rapunzel.mp4" preload="auto" loop></audio>

    <script>
        const esMovil = window.matchMedia('(max-width: 768px), (pointer: coarse)').matches;
        const musica = document.getElementById('musica');
        const frases = [
            "Sos Bella y brillante✨",
            "Saranghae🌹",
            "Viejita linda jiji",
            "Sos una genia",
            "Bogoshipo",
            "Yeppeoyo",
            "Confiá en voss<3",
            "Estoy orgulloso de vos🥰",
            "Sos capaz de todo y más",
            "hwaiting",
            "Paso a paso, lo estás haciendo genial",
            "Con vos todo brilla más",
            "Saranghae🌹"
        ];
        let mazoFrases = [];
        let ultimaFrase = '';
        let musicaIniciada = false;

        function mezclarFrases(lista) {
            const copia = [...lista];
            for (let i = copia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copia[i], copia[j]] = [copia[j], copia[i]];
            }
            return copia;
        }

        function obtenerFraseUnica() {
            if (mazoFrases.length === 0) {
                mazoFrases = mezclarFrases(frases);

                if (mazoFrases.length > 1 && mazoFrases[0] === ultimaFrase) {
                    [mazoFrases[0], mazoFrases[1]] = [mazoFrases[1], mazoFrases[0]];
                }
            }

            const frase = mazoFrases.pop();
            ultimaFrase = frase;
            return frase;
        }

        // Función para crear e iniciar la frase flotante en el lugar del clic
        function crearFraseFlotante(x, y) {
            const fraseElemento = document.createElement('div');
            fraseElemento.classList.add('floating-phrase');
            fraseElemento.style.visibility = 'hidden';
            
            // Elegimos una frase random
            const fraseAleatoria = obtenerFraseUnica();
            fraseElemento.innerText = fraseAleatoria;
            
            document.body.appendChild(fraseElemento);

            const margen = 12;
            const altoSeguridad = 28;
            const rect = fraseElemento.getBoundingClientRect();
            const ancho = rect.width;
            const alto = rect.height;

            const xAjustado = Math.min(
                Math.max(x, margen + ancho / 2),
                window.innerWidth - margen - ancho / 2
            );
            const yAjustado = Math.min(
                Math.max(y, alto + altoSeguridad),
                window.innerHeight - margen - alto / 2
            );

            fraseElemento.style.left = `${xAjustado}px`;
            fraseElemento.style.top = `${yAjustado}px`;
            fraseElemento.style.visibility = 'visible';
            
            // Se borra del código cuando termina de subir y desvanecerse
            fraseElemento.addEventListener('animationend', () => fraseElemento.remove());
        }

        // Función para el efecto de partículas ("reventar")
        function explotarLinterna(x, y) {
            const cantidadParticulas = esMovil ? 10 : 20;
            for (let i = 0; i < cantidadParticulas; i++) {
                const particula = document.createElement('div');
                particula.classList.add('particle');
                
                const angulo = Math.random() * Math.PI * 2;
                const distancia = Math.random() * (esMovil ? 50 : 80) + (esMovil ? 12 : 20);
                
                particula.style.setProperty('--mx', `${Math.cos(angulo) * distancia}px`);
                particula.style.setProperty('--my', `${Math.sin(angulo) * distancia}px`);
                
                particula.style.left = `${x}px`;
                particula.style.top = `${y}px`;
                
                document.body.appendChild(particula);
                particula.addEventListener('animationend', () => particula.remove());
            }
        }

        // Función para generar una linterna flotante
        function crearLinterna() {
            const linterna = document.createElement('div');
            linterna.classList.add('lantern');
            
            const posX = Math.random() * 92;
            linterna.style.left = `${posX}%`;
            
            const escala = esMovil ? (Math.random() * 0.22 + 0.68) : (Math.random() * 0.4 + 0.8);
            const duracion = esMovil ? (Math.random() * 4 + 14) : (Math.random() * 6 + 12);   
            
            linterna.style.transform = `scale(${escala})`;
            linterna.style.animationDuration = `${duracion}s`; 

            const activarLinterna = () => {
                if (linterna.dataset.activada === '1') {
                    return;
                }

                linterna.dataset.activada = '1';

                if (!musicaIniciada) {
                    musicaIniciada = true;
                    musica.play().catch(() => {});
                }

                const rect = linterna.getBoundingClientRect();
                const centroX = rect.left + rect.width / 2;
                const centroY = rect.top + rect.height / 2;
                
                explotarLinterna(centroX, centroY);
                crearFraseFlotante(centroX, centroY); // Llama a la frase en esa posición
                linterna.remove(); 
            };

            linterna.addEventListener('pointerdown', activarLinterna, { once: true });
            linterna.addEventListener('click', activarLinterna, { once: true });

            document.body.appendChild(linterna);
            linterna.addEventListener('animationend', () => linterna.remove());
        }

        // Generar linternas continuamente
        setInterval(crearLinterna, esMovil ? 2200 : 1300);

        // Linternas iniciales
        for(let i=0; i < (esMovil ? 2 : 4); i++) {
            setTimeout(crearLinterna, Math.random() * (esMovil ? 1200 : 2000));
        }
    </script>
</body>
</html>
